# open-spri all-in-one stack. Quick start: cp .env.example .env, adjust, `docker compose up -d`.
# Containers: api, db, frontend and - with profile "proxy" (default in .env.example) - proxy + certbot.
# For an external reverse proxy see compose.external-proxy.yaml and docs/betrieb.md.
name: open-spri

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: openspri
      MARIADB_USER: openspri
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD in .env setzen}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
    image: ${OPENSPRI_IMAGE_PREFIX:-ghcr.io/rcrack2k/open-spri}/api:${OPENSPRI_VERSION:-local}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/openspri
      SPRING_DATASOURCE_USERNAME: openspri
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      OPENSPRI_BUILD_DIGEST: ${OPENSPRI_BUILD_DIGEST:-}
      # Encrypts the signing key stored by the setup wizard; never stored in the database (docs/betrieb.md)
      OPENSPRI_MASTER_KEY: ${OPENSPRI_MASTER_KEY:-}
      # WS-Security signing key (PKCS#12, RSA >= 3072). Without it a temporary key is generated (development only).
      OPENSPRI_SOAP_SIGNING_KEYSTORE: ${OPENSPRI_SOAP_SIGNING_KEYSTORE:-}
      OPENSPRI_SOAP_SIGNING_KEYSTORE_PASSWORD: ${OPENSPRI_SOAP_SIGNING_KEYSTORE_PASSWORD:-}
      OPENSPRI_SOAP_PUBLISHED_ENDPOINT_URL: ${OPENSPRI_SOAP_PUBLISHED_ENDPOINT_URL:-https://${PUBLIC_HOSTNAME:-localhost}/spri/v4}
      SPRI_OUTBOUND_PROXY: ${SPRI_OUTBOUND_PROXY:-}
      OPENSPRI_MESSAGE_CODES_FILE: ${OPENSPRI_MESSAGE_CODES_FILE:-}
      OPENSPRI_SOAP_ATTRIBUTE_RULES_INBOUND: ${OPENSPRI_SOAP_ATTRIBUTE_RULES_INBOUND:-report}
      OPENSPRI_OUTBOX_RETRY_INTERVAL: ${OPENSPRI_OUTBOX_RETRY_INTERVAL:-5m}
      OPENSPRI_OUTBOX_MAX_ATTEMPTS: ${OPENSPRI_OUTBOX_MAX_ATTEMPTS:-12}
      OPENSPRI_EVENTS_RETENTION: ${OPENSPRI_EVENTS_RETENTION:-90d}
      # daily Replikat of our availabilities (Leistungserbringer), ready before 06:00 (docs/api/verfuegbarkeit.md)
      OPENSPRI_REPLIKAT_EXPORT_CRON: ${OPENSPRI_REPLIKAT_EXPORT_CRON:-0 0 3 * * *}
      # daily import of the partners' Replikate (Auftraggeber), after they are due at 06:00
      OPENSPRI_REPLIKAT_IMPORT_CRON: ${OPENSPRI_REPLIKAT_IMPORT_CRON:-0 0 7 * * *}
      # e-mail notifications (optional; without SPRING_MAIL_HOST they are only logged)
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      OPENSPRI_NOTIFICATIONS_FROM: ${OPENSPRI_NOTIFICATIONS_FROM:-open-spri@localhost}
      OPENSPRI_NOTIFICATIONS_OPERATOR_EMAIL: ${OPENSPRI_NOTIFICATIONS_OPERATOR_EMAIL:-}
      TZ: Europe/Berlin
    volumes:
      # Directory for the signing keystore, e.g. ./secrets/spri-signature.p12 -> /run/openspri/spri-signature.p12
      - ./secrets:/run/openspri:ro
      # Configuration files that must not be part of the image, e.g. the message code table (Anlage 5)
      - ./config:/etc/openspri:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl; bash's /dev/tcp is enough for a readiness probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  # KFT-like simulator (AUFGABE 10.3), only for test and development: COMPOSE_PROFILES=proxy,simulator.
  # Same image as api in OPENSPRI_MODE=SIMULATOR; docs/kft-szenarien.md, section "Simulator als Container".
  spri-simulator:
    profiles: [simulator]
    image: ${OPENSPRI_IMAGE_PREFIX:-ghcr.io/rcrack2k/open-spri}/api:${OPENSPRI_VERSION:-local}
    restart: "no"
    environment:
      OPENSPRI_MODE: SIMULATOR
      OPENSPRI_SIM_TARGET_URL: http://api:8080
      # API token of the instance: role ADMIN with the scope orders:override (ADR-0008)
      OPENSPRI_SIM_TOKEN: ${OPENSPRI_SIM_TOKEN:-}
      OPENSPRI_SIM_PUBLIC_URL: http://spri-simulator:8090/spri/v4
      # inside the stack the simulator talks to the api directly, not through the proxy
      OPENSPRI_SIM_TARGET_SPRI_URL: http://api:8080/spri/v4
      # KFT test case list (xlsx, not part of the image): put it into ./config
      OPENSPRI_KFT_TEST_CASES: ${OPENSPRI_KFT_TEST_CASES:-/etc/openspri/Testfaelle_SPRIv4X_20250523.xlsx}
      TZ: Europe/Berlin
    volumes:
      - ./config:/etc/openspri:ro
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    image: ${OPENSPRI_IMAGE_PREFIX:-ghcr.io/rcrack2k/open-spri}/frontend:${OPENSPRI_VERSION:-local}
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    profiles: [proxy]
    build:
      context: .
      dockerfile: deploy/proxy/Dockerfile
    image: ${OPENSPRI_IMAGE_PREFIX:-ghcr.io/rcrack2k/open-spri}/proxy:${OPENSPRI_VERSION:-local}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - ./deploy/nginx/snippets/openspri-spri-allowlist.conf:/etc/nginx/snippets/openspri-spri-allowlist.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

  certbot:
    profiles: [proxy]
    image: certbot/certbot:v5.1.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/openspri/run.sh"]
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
      ACME_ENABLED: ${ACME_ENABLED:-true}
      ACME_STAGING: ${ACME_STAGING:-false}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_KEY_TYPE: ${ACME_KEY_TYPE:-ecdsa}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - ./deploy/certbot/run.sh:/opt/openspri/run.sh:ro
    depends_on:
      - proxy

volumes:
  db-data:
  letsencrypt:
  certbot-webroot:
