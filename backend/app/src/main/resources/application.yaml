# Default configuration. Every value can be overridden by environment variables
# (Spring relaxed binding, e.g. SPRING_DATASOURCE_URL) - see .env.example.
spring:
  application:
    name: open-spri
  datasource:
    url: jdbc:mariadb://localhost:3306/openspri
    username: openspri
    password: openspri
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true   # RFC 9457 error responses
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  # Behind the proxy the client address comes from X-Forwarded-For. Tomcat trusts it only from
  # internal addresses (10/8, 172.16/12, 192.168/16, 127/8, ...), see server.tomcat.remoteip.internal-proxies.
  forward-headers-strategy: native

# S/PRI SOAP endpoint: <cxf.path>/v4 = /spri/v4 (WSDL: /spri/v4?wsdl)
cxf:
  path: /spri

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info
  health:
    # The S/PRI interface is available even when the mail server is not; notifications are only an add-on.
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true   # /health/liveness and /health/readiness
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/docs
  paths-to-match: /api/**
  writer-with-order-by-keys: true

openspri:
  # Message code table (Anlage 5), AK export from Confluence or neutral CSV; imported at startup when new.
  message-codes:
    file: ${OPENSPRI_MESSAGE_CODES_FILE:}
  inbox:
    poll-interval: 1s
  soap:
    signing-keystore: ${OPENSPRI_SOAP_SIGNING_KEYSTORE:}
    signing-keystore-password: ${OPENSPRI_SOAP_SIGNING_KEYSTORE_PASSWORD:}
    published-endpoint-url: ${OPENSPRI_SOAP_PUBLISHED_ENDPOINT_URL:}
    client:
      outbound-proxy: ${SPRI_OUTBOUND_PROXY:}
  certification:
    build-digest: ${OPENSPRI_BUILD_DIGEST:}
    certified-digests: []
