# Default configuration. Every value can be overridden by environment variables
# (Spring relaxed binding, e.g. SPRING_DATASOURCE_URL) - see .env.example.
spring:
  application:
    name: open-spri
  datasource:
    url: jdbc:mariadb://localhost:3306/openspri
    username: openspri
    password: openspri
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true   # RFC 9457 error responses
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  # Behind the proxy the client address comes from X-Forwarded-For. Tomcat trusts it only from
  # internal addresses (10/8, 172.16/12, 192.168/16, 127/8, ...), see server.tomcat.remoteip.internal-proxies.
  forward-headers-strategy: native

# S/PRI SOAP endpoint: <cxf.path>/v4 = /spri/v4 (WSDL: /spri/v4?wsdl)
cxf:
  path: /spri

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus
      # Prometheus format under /metrics (AUFGABE 8.5), requires scope metrics:read (SecurityConfiguration)
      path-mapping:
        prometheus: metrics
  health:
    # The S/PRI interface is available even when the mail server is not; notifications are only an add-on.
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true   # /health/liveness and /health/readiness
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/docs
  paths-to-match: /api/**
  writer-with-order-by-keys: true

openspri:
  # Encrypts the signing key stored by the setup wizard (AES-256-GCM). base64, 32 bytes: openssl rand -base64 32
  master-key: ${OPENSPRI_MASTER_KEY:}
  # Message code table (Anlage 5), AK export from Confluence or neutral CSV; imported at startup when new.
  message-codes:
    file: ${OPENSPRI_MESSAGE_CODES_FILE:}
  inbox:
    poll-interval: 1s
  # Events for external systems (feed GET /api/v1/events, webhooks); contain no end customer data.
  events:
    retention: ${OPENSPRI_EVENTS_RETENTION:90d}
  webhooks:
    poll-interval: 2s
  # Idempotency-Key of POST /api/v1/orders… is remembered this long.
  idempotency:
    retention: 24h
  soap:
    signing-keystore: ${OPENSPRI_SOAP_SIGNING_KEYSTORE:}
    signing-keystore-password: ${OPENSPRI_SOAP_SIGNING_KEYSTORE_PASSWORD:}
    published-endpoint-url: ${OPENSPRI_SOAP_PUBLISHED_ENDPOINT_URL:}
    client:
      outbound-proxy: ${SPRI_OUTBOUND_PROXY:}
  # NF-10 (ADR-0010): remove end customer data this long after completion, e.g. 730d; 0 = keep (docs/betrieb.md)
  retention:
    personal-data: ${OPENSPRI_RETENTION_PERSONAL_DATA:0}
    cron: ${OPENSPRI_RETENTION_CRON:0 30 2 * * *}
  # Self-tests (AUFGABE 7.4, 7.6): issuer whitelist for the TLS check (parts of the issuer DN, comma separated)
  # and a service answering with the caller's IP for the outbound IP check; both empty by default.
  selftest:
    trusted-issuers: ${OPENSPRI_SELFTEST_TRUSTED_ISSUERS:}
    ip-echo-url: ${OPENSPRI_SELFTEST_IP_ECHO_URL:}
  certification:
    build-digest: ${OPENSPRI_BUILD_DIGEST:}
    certified-digests: []
