# Default configuration. Every value can be overridden by environment variables
# (Spring relaxed binding, e.g. SPRING_DATASOURCE_URL) - see .env.example.
spring:
  application:
    name: open-spri
  datasource:
    url: jdbc:mariadb://localhost:3306/openspri
    username: openspri
    password: openspri
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true   # RFC 9457 error responses
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true   # /health/liveness and /health/readiness
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/docs
  paths-to-match: /api/**
  writer-with-order-by-keys: true

openspri:
  certification:
    build-digest: ${OPENSPRI_BUILD_DIGEST:}
    certified-digests: []
