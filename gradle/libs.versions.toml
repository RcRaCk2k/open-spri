# Central version catalog. Versions managed by the Spring Boot BOM are not repeated here.
[versions]
kotlin = "2.4.21"            # aligned with spring-boot-dependencies 4.1.2
spring-boot = "4.1.2"
cxf = "4.2.4"
wss4j = "4.0.2"             # version used by CXF 4.2.4 (cxf.jakarta.wss4j.version)                # built against Spring Boot 4.1 / Spring 7 (used from M1)
springdoc = "3.2.0"          # Spring Boot 4.1 line
archunit = "1.5.1"
flyway-mysql = "13.12.0"
bouncycastle = "1.86"
poi = "6.0.0"               # simulator: reads the KFT test case list (xlsx)      # same as CXF 4.2.4 (cxf.bcprov.version)      # keep in sync with flyway.version of the Boot BOM

# Security fixes ahead of the Spring Boot BOM (Trivy in CI, AUFGABE 13); remove when the BOM catches up.
jackson2 = "2.22.4"          # Jackson 2 comes in transitively (CXF, springdoc) above the BOM's 2.21.x
guava = "33.8.0-jre"         # via WSS4J

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway-mysql" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
jaxb-xjc = { module = "org.glassfish.jaxb:jaxb-xjc" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime" }
jakarta-xml-bind-api = { module = "jakarta.xml.bind:jakarta.xml.bind-api" }
cxf-frontend-jaxws = { module = "org.apache.cxf:cxf-rt-frontend-jaxws", version.ref = "cxf" }
cxf-transports-http = { module = "org.apache.cxf:cxf-rt-transports-http", version.ref = "cxf" }
cxf-transports-http-hc5 = { module = "org.apache.cxf:cxf-rt-transports-http-hc5", version.ref = "cxf" }
saaj-impl = { module = "com.sun.xml.messaging.saaj:saaj-impl" }   # version from Spring Boot BOM, same as CXF
wss4j-dom = { module = "org.apache.wss4j:wss4j-ws-security-dom", version.ref = "wss4j" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
cxf-spring-boot-starter-jaxws = { module = "org.apache.cxf:cxf-spring-boot-starter-jaxws", version.ref = "cxf" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# build-logic
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
