name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # Includes unit tests, ArchUnit rules, Testcontainers integration tests (MariaDB)
      # and the check that docs/api/openapi.json matches the served specification.
      - run: ./gradlew build --console=plain
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: backend-test-reports
          path: backend/*/build/reports/tests/

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match docs/api/openapi.json
        run: pnpm check:api
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose:
    name: Compose smoke test (all-in-one)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-secret/; s/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=ci-root-secret/' .env
          sed -i 's/^ACME_ENABLED=.*/ACME_ENABLED=false/' .env
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check endpoints through the proxy
        run: |
          curl -kfsS https://localhost/health
          curl -kfsS https://localhost/api/v1/about | tee /dev/stderr | grep -q '"spriVersion":"4.4"'
          curl -kfsS https://localhost/ | grep -q '<title>open-spri</title>'
          curl -kfsS https://localhost/api/v1/openapi.json | grep -q '"openapi"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/v1/about)" = "301"
      - name: TLS protocols (TLS 1.0/1.1 must be refused)
        run: |
          echo | openssl s_client -connect localhost:443 -tls1_2 >/dev/null 2>&1
          ! echo | openssl s_client -connect localhost:443 -tls1_1 >/dev/null 2>&1
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
