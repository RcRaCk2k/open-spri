name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # AK S&P files (XSD, downloaded and checksum-verified by the build) - keeps CI independent of ak-spri.de.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/open-spri
          key: ak-spri-${{ hashFiles('backend/spri-schema/build.gradle.kts', 'backend/simulator/build.gradle.kts', 'backend/spri-rules/build.gradle.kts') }}
          restore-keys: ak-spri-
      - name: Install xmlsec1 (independent signature check in WsSecurityTest)
        run: sudo apt-get update -q && sudo apt-get install -y -q xmlsec1
      # Includes unit tests, ArchUnit rules, Testcontainers integration tests (MariaDB)
      # and the check that docs/api/openapi.json matches the served specification.
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee gradle.log
      - name: Report build failure as annotation
        if: failure()
        run: |
          echo "::notice title=ak-spri.de reachable?::HTTP $(curl -s -o /dev/null -m 20 -w '%{http_code}' -A 'open-spri-build (+https://github.com/RcRaCk2k/open-spri)' https://ak-spri.de/wp-content/uploads/Anlage_3_XSD_SPRI_V.4.x.zip || true)"
          summary=$(grep -E "What went wrong|Caused by|Exception|FAILED|^e: |^> |error" gradle.log | grep -v "^> Task" | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle build failed::${summary}"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: backend-test-reports
          path: |
            backend/*/build/reports/
            build/reports/problems/

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match docs/api/openapi.json
        run: pnpm check:api
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose:
    name: Compose smoke test (all-in-one)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-secret/; s/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=ci-root-secret/' .env
          sed -i 's/^ACME_ENABLED=.*/ACME_ENABLED=false/' .env
      - name: Build images
        run: |
          set -o pipefail
          docker compose build --progress plain 2>&1 | tee compose-build.log
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 300
      - name: Check endpoints through the proxy
        run: |
          curl -kfsS https://localhost/health
          curl -kfsS https://localhost/api/v1/about | tee /dev/stderr | grep -q '"spriVersion":"4.4"'
          curl -kfsS https://localhost/ | grep -q '<title>open-spri</title>'
          curl -kfsS https://localhost/api/v1/openapi.json | grep -q '"openapi"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/v1/about)" = "301"
          # S/PRI endpoint: no partner configured, so every address must be refused (AK security document 2.6)
          test "$(curl -ks -o /dev/null -w '%{http_code}' 'https://localhost/spri/v4?wsdl')" = "403"
      - name: TLS protocols (TLS 1.0/1.1 must be refused)
        run: |
          echo | openssl s_client -connect localhost:443 -tls1_2 >/dev/null 2>&1
          ! echo | openssl s_client -connect localhost:443 -tls1_1 >/dev/null 2>&1
      - name: Logs
        if: always()
        run: docker compose ps -a; docker compose logs --no-color | tee compose.log
      - name: Report stack failure as annotation
        if: failure()
        run: |
          annotate() { sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          if [ -f compose-build.log ]; then
            echo "::error title=docker compose build::$(grep -iE 'error|failed|what went wrong|^#[0-9]+ .*(e: |exception)' compose-build.log | tail -40 | annotate)"
          fi
          echo "::error title=docker compose ps::$(docker compose ps -a 2>&1 | annotate)"
          echo "::error title=docker compose logs::$(tail -60 compose.log 2>/dev/null | annotate)"
      - name: Stop stack
        if: always()
        run: docker compose down -v
