name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # AK S&P files (XSD, downloaded and checksum-verified by the build) - keeps CI independent of ak-spri.de.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/open-spri
          key: ak-spri-${{ hashFiles('backend/spri-schema/build.gradle.kts', 'backend/simulator/build.gradle.kts', 'backend/replikat/build.gradle.kts', 'backend/spri-rules/build.gradle.kts') }}
          restore-keys: ak-spri-
      - name: Install xmlsec1 (independent signature check in WsSecurityTest)
        run: sudo apt-get update -q && sudo apt-get install -y -q xmlsec1
      # Includes unit tests, ArchUnit rules, Testcontainers integration tests (MariaDB)
      # and the check that docs/api/openapi.json matches the served specification.
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee gradle.log
      # AUFGABE 10.1 item 7: 1000 signed orders from 50 parallel senders (TEQ p95 < 1 s), one 10 MB attachment
      - name: Load test
        run: |
          set -o pipefail
          ./gradlew :app:test -Pload --console=plain 2>&1 | tee -a gradle.log | grep "LOAD:" | while read -r line; do echo "::notice title=Lasttest::$line"; done
      - name: Report build failure as annotation
        if: failure()
        run: |
          echo "::notice title=ak-spri.de reachable?::HTTP $(curl -s -o /dev/null -m 20 -w '%{http_code}' -A 'open-spri-build (+https://github.com/RcRaCk2k/open-spri)' https://ak-spri.de/wp-content/uploads/Anlage_3_XSD_SPRI_V.4.x.zip || true)"
          summary=$(grep -E "What went wrong|Caused by|Exception|FAILED|^e: |^> |error" gradle.log | grep -v "^> Task" | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle build failed::${summary}"
          # failed tests with their assertion message (the logs and reports need a login)
          tests=$(grep -A8 " FAILED$" gradle.log | grep -v "^\s*at " | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -n "$tests" ]; then echo "::error title=Failed tests::${tests}"; fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: backend-test-reports
          path: |
            backend/*/build/reports/
            build/reports/problems/

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match docs/api/openapi.json
        run: pnpm check:api
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose:
    name: Compose stack, smoke and E2E tests (all-in-one)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-secret/; s/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=ci-root-secret/' .env
          sed -i 's/^ACME_ENABLED=.*/ACME_ENABLED=false/' .env
          # the setup wizard stores the generated signing key encrypted with the master key
          sed -i "s|^OPENSPRI_MASTER_KEY=.*|OPENSPRI_MASTER_KEY=$(openssl rand -base64 32)|" .env
      - name: Build images
        run: |
          set -o pipefail
          docker compose build --progress plain 2>&1 | tee compose-build.log
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 300
      - name: Check endpoints through the proxy
        run: |
          curl -kfsS https://localhost/health
          curl -kfsS https://localhost/api/v1/about | tee /dev/stderr | grep -q '"spriVersion":"4.4"'
          curl -kfsS https://localhost/ | grep -q '<title>open-spri</title>'
          curl -kfsS https://localhost/api/v1/openapi.json | grep -q '"openapi"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/v1/about)" = "301"
          # metrics only with a token (scope metrics:read); security headers of the frontend (CSP)
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost/metrics)" = "401"
          curl -ksI https://localhost/ | grep -qi '^content-security-policy:'
          ! curl -ksI https://localhost/ | grep -qi '^server: nginx/'
          # S/PRI endpoint: no partner configured, so every address must be refused (AK security document 2.6)
          test "$(curl -ks -o /dev/null -w '%{http_code}' 'https://localhost/spri/v4?wsdl')" = "403"
      - name: TLS protocols (TLS 1.0/1.1 must be refused)
        run: |
          echo | openssl s_client -connect localhost:443 -tls1_2 >/dev/null 2>&1
          ! echo | openssl s_client -connect localhost:443 -tls1_1 >/dev/null 2>&1
      # AUFGABE 10.1 item 8: TLS configuration of the proxy. The CI stack has a temporary self-signed certificate,
      # so findings about the certificate itself (cert_*) are expected; everything else from MEDIUM up fails.
      - name: TLS configuration (testssl.sh)
        run: |
          mkdir -p testssl && chmod 777 testssl
          docker run --rm --network host -v "$PWD/testssl:/out" ghcr.io/testssl/testssl.sh:3.2 --quiet --color 0 \
            --protocols --std --fs --server-defaults --vulnerable --headers --jsonfile /out/testssl.json https://localhost:443 > testssl/testssl.txt || true
          python3 - <<'PY'
          import json, sys
          findings = [f for f in json.load(open("testssl/testssl.json"))
                      if f["severity"] in ("MEDIUM", "HIGH", "CRITICAL") and not f["id"].startswith("cert") and f["id"] != "DNS_CAArecord"
                      # grade "T" only means: certificate not trusted (the temporary self-signed one); any other grade counts
                      and not (f["id"] == "overall_grade" and f["finding"] == "T")]
          for f in findings:
              print(f"::error title=testssl {f['id']}::{f['severity']}: {f['finding']}")
          sys.exit(1 if findings else 0)
          PY
      # Container images without known HIGH/CRITICAL vulnerabilities that have a fix (AUFGABE 13)
      - name: Vulnerability scan of the images (Trivy)
        run: |
          for image in api frontend proxy; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:0.69.3 image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore --exit-code 1 --quiet \
              ghcr.io/rcrack2k/open-spri/$image:local
          done
      # Playwright E2E against the complete stack behind the proxy (AUFGABE 10.1 item 9, M7):
      # setup wizard with the token from the API log, login, all pages, only /api/v1, axe WCAG 2.1 AA
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Playwright
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: E2E tests (Playwright)
        working-directory: frontend
        run: |
          export E2E_SETUP_TOKEN=$(docker compose logs api --no-color | grep -oE 'setup token: [A-Za-z0-9_-]+' | tail -1 | cut -d' ' -f3)
          test -n "$E2E_SETUP_TOKEN"
          E2E_BASE_URL=https://localhost pnpm e2e
      # AUFGABE 10.1 item 8: OWASP ZAP baseline (passive) against the stack; .github/zap/rules.tsv lists accepted warnings
      - name: OWASP ZAP baseline
        run: |
          mkdir -p zap && cp .github/zap/rules.tsv zap/ && chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://localhost -c rules.tsv -r zap-report.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: |
            testssl/
            zap/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
      - name: Logs
        if: always()
        run: docker compose ps -a; docker compose logs --no-color | tee compose.log
      - name: Report stack failure as annotation
        if: failure()
        run: |
          annotate() { sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          if [ -f compose-build.log ]; then
            echo "::error title=docker compose build::$(grep -iE 'error|failed|what went wrong|^#[0-9]+ .*(e: |exception)' compose-build.log | tail -40 | annotate)"
          fi
          echo "::error title=docker compose ps::$(docker compose ps -a 2>&1 | annotate)"
          echo "::error title=docker compose logs::$(tail -60 compose.log 2>/dev/null | annotate)"
      - name: Stop stack
        if: always()
        run: docker compose down -v
