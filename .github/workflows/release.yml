name: Release

# Release builds (AUFGABE NF-13, M8): on a tag v* the images api, frontend and proxy are built for amd64 and arm64,
# pushed to GHCR, signed with Cosign (keyless, GitHub OIDC) and get a CycloneDX SBOM as signed attestation.
# The GitHub release carries the SBOMs and the image digests. Verification: docs/betrieb.md, "Images prüfen".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # GitHub release
  packages: write     # push to ghcr.io
  id-token: write     # keyless Cosign signature
  attestations: write

env:
  REGISTRY: ghcr.io/rcrack2k/open-spri

jobs:
  images:
    name: Images bauen, signieren, SBOM
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, frontend, proxy]
    steps:
      - uses: actions/checkout@v7
      - name: Version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # reproducible image timestamps: commit time instead of build time
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: OPENSPRI_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          outputs: type=registry,rewrite-timestamp=true
      - name: Vulnerability scan (Trivy)
        run: |
          docker run --rm -e TRIVY_USERNAME="${{ github.actor }}" -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}" -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:0.69.3 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore --exit-code 1 --quiet \
            ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -e TRIVY_USERNAME="${{ github.actor }}" -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}" aquasec/trivy:0.69.3 image --format cyclonedx --quiet \
            ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }} > sbom-${{ matrix.image }}.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign image and attach SBOM
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type cyclonedx --predicate sbom-${{ matrix.image }}.cdx.json "$IMAGE"
          echo "${{ matrix.image }} ${{ steps.build.outputs.digest }}" > digest-${{ matrix.image }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.image }}
          path: |
            sbom-${{ matrix.image }}.cdx.json
            digest-${{ matrix.image }}.txt

  release:
    name: GitHub-Release
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
      - name: SBOM of the frontend sources (npm packages are not visible in the built image)
        run: |
          docker run --rm -v "$PWD/frontend:/src:ro" aquasec/trivy:0.69.3 fs --format cyclonedx --quiet /src > sbom-frontend-sources.cdx.json
      - name: Release notes
        run: |
          {
            echo "Images (signiert mit Cosign, Prüfung siehe docs/betrieb.md):"
            echo
            echo '```'
            sed "s|^\([a-z]*\) |${REGISTRY}/\1@|" digest-*.txt
            echo '```'
            echo
            echo "Änderungen: siehe CHANGELOG/ im Repository."
          } > notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --title "open-spri ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag $prerelease \
            sbom-*.cdx.json digest-*.txt
