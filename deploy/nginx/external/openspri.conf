# Example for an EXTERNAL nginx (variant B, docs/betrieb.md). Copy deploy/nginx/snippets/ to
# /etc/nginx/snippets/ and start the stack with compose.external-proxy.yaml, which publishes
# api on 127.0.0.1:8080 and frontend on 127.0.0.1:8081.
#
# Certificate requirements (AK S&P security document V3.0): CA from the AK whitelist
# (Let's Encrypt is allowed), key ECDSA P-256 or RSA >= 3072 bit. Check with:
#   openssl x509 -in /etc/letsencrypt/live/<host>/cert.pem -noout -text | grep "Public-Key"

upstream openspri_api      { server 127.0.0.1:8080; }
upstream openspri_frontend { server 127.0.0.1:8081; }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spri.example.de;

    ssl_certificate     /etc/letsencrypt/live/spri.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spri.example.de/privkey.pem;

    include /etc/nginx/snippets/openspri-tls.conf;
    include /etc/nginx/snippets/openspri-locations.conf;
}
