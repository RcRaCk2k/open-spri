# Optional additional IP allowlist for the S/PRI endpoint (/spri/).
# open-spri itself always checks the partner IPs configured in the application; this file adds
# a second line of defence in nginx. Example:
#   allow 203.0.113.10;     # Partner A, outbound IP
#   allow 198.51.100.0/28;  # Enghouse KFT
#   deny all;
allow all;
