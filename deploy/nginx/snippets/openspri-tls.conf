# TLS settings required by the AK S&P security document V3.0, chapter 2.4
# (HTTPS, at least TLS 1.2) and aligned with BSI TR-02102-2.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers on;
ssl_ecdh_curve secp384r1:secp256r1;
ssl_session_timeout 1d;
ssl_session_cache shared:openspri_tls:10m;
ssl_session_tickets off;
# No OCSP stapling: Let's Encrypt no longer operates OCSP responders (since 2025).

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
