# Routing of open-spri. Requires the upstreams "openspri_api" and "openspri_frontend".
# Shared by the all-in-one proxy container and external reverse proxies.

client_max_body_size 25m;          # orders and messages may carry attachments
proxy_http_version 1.1;
proxy_set_header Host $host;
# The edge proxy overwrites (not appends) the client address. open-spri trusts these headers
# only from the configured proxy and uses them for the per-partner IP allowlist.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 10s;
proxy_send_timeout 130s;           # spec 11.4: up to 120 s with attachments
proxy_read_timeout 130s;
# The edge proxy sets these headers itself (openspri-tls.conf); hide the upstream copies so that each is sent once.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Strict-Transport-Security;

# S/PRI SOAP endpoint (partners only)
location /spri/ {
    include /etc/nginx/snippets/openspri-spri-allowlist.conf;
    proxy_pass http://openspri_api;
}

# Replikat download and online availability check (partners)
location /replikat/ {
    proxy_pass http://openspri_api;
}

# Public REST API incl. Swagger UI (/api/docs)
location /api/ {
    proxy_pass http://openspri_api;
}

location = /health {
    proxy_pass http://openspri_api;
}

# Prometheus metrics, only with an API token carrying scope metrics:read
location = /metrics {
    proxy_pass http://openspri_api;
}

# Web frontend
location / {
    proxy_pass http://openspri_frontend;
}
