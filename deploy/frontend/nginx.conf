# Serves the single-page application. TLS and routing of /api are done by the edge proxy
# (container "proxy" or an external reverse proxy), see deploy/nginx/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed assets can be cached forever; index.html must always be revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
