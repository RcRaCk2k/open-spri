# Serves the single-page application. TLS and routing of /api are done by the edge proxy
# (container "proxy" or an external reverse proxy), see deploy/nginx/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Hashed assets can be cached forever; index.html must always be revalidated.
    location /assets/ {
        include /etc/nginx/openspri/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/openspri/security-headers.conf;
        # index.html is tiny: never store it, so that a new release is picked up at once
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }
}
